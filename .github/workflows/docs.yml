name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    name: Docs index
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      # Validates frontmatter, deliverable IDs, relative links and the generated index
      # (scripts/docs-index.mjs, the byte-identical copy of docker-host's validator).
      - name: Check docs index and frontmatter
        run: node scripts/docs-index.mjs --check
